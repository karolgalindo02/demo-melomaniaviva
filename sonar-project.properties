# Información del Proyecto
sonar.projectKey=karolgalindo02_demo-melomaniaviva
sonar.organization=karolgalindo02

# Nombre y versión del proyecto
sonar.projectName=Melomania Viva
sonar.projectVersion=1.0

# Ruta al código fuente (relativa al archivo sonar-project.properties)
sonar.sources=.

# Lenguaje del proyecto
sonar.language=js

# Codificación del código fuente
sonar.sourceEncoding=UTF-8

# Archivos y directorios a excluir del análisis
sonar.exclusions=**/node_modules/**,**/*.spec.js,**/*.test.js,**/coverage/**,**/dist/**,**/build/**

# Rutas de archivos JavaScript
sonar.javascript.file.suffixes=.js

# Configuración ECMAScript
sonar.javascript.environments=browser,amd

# Configuración de análisis JavaScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Ignorar archivos específicos de cobertura si es necesario
sonar.coverage.exclusions=**/*.spec.js,**/*.test.js,**/firebase-config.js

